# Netlify (Git or CLI deploys). Headers live in dist/_headers, generated by the build
# (vite/headers.ts), so drag-and-drop deploys of dist/ get them too.
[build]
  # `models` only downloads the MediaPipe models if they are missing from the repo.
  command = "npm run models && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
